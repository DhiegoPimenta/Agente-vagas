<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curadoria de vagas — Tiago</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #e5e5e5;
    --accent: #0b5cff; --ok: #0a7a2f; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8e8e8; --muted: #9aa0a6; --line: #2c2f36;
      --accent: #5b9bff; --ok: #4caf6a; --card: #1b1e24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    margin: 10px 0; background: var(--card);
  }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .title { font-weight: 600; font-size: 15px; color: var(--accent); text-decoration: none; }
  .badge {
    background: var(--accent); color: #fff; border-radius: 12px;
    padding: 2px 9px; font-size: 12px; white-space: nowrap;
  }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .sal { color: var(--ok); font-size: 13px; }
  ul.reasons { font-size: 13px; color: var(--muted); margin: 6px 0 0 18px; padding: 0; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .analysis { font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; margin-top: 6px; }
  .chat-log { font-size: 13px; white-space: pre-wrap; margin: 6px 0; }
  .chat-row { display: flex; gap: 6px; }
  .chat-row input {
    flex: 1; padding: 7px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; background: var(--bg); color: var(--fg);
  }
  button {
    padding: 7px 12px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); width: 100%; padding: 9px; }
  button[disabled] { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 10px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Curadoria de vagas — Tiago</h1>
  <p class="sub" id="sub">carregando…</p>
  <div id="status">Buscando vagas…</div>
  <div id="list"></div>
  <button class="ghost" id="more" hidden>Buscar mais</button>
  <p class="foot">
    Fontes: RemoteOK e Arbeitnow · LinkedIn e Indeed não são automatizados ·
    “Sobre a empresa” é conhecimento geral do modelo, pode estar desatualizado.<br>
    Código:
    <a href="https://github.com/DhiegoPimenta/Agente-vagas">frontend</a> ·
    <a href="https://github.com/DhiegoPimenta/Agente-vagas-backend">backend</a>
  </p>
</div>

<script>
const BACKEND = "https://agente-vagas-backend.onrender.com";
const PAGE = 10, STEP = 5;
let jobs = [], shown = 0;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
));
const regionTag = (r) => {
  const m = {
    br:       ["BR",       "#0a7a2f", "Brasil / remoto BR"],
    global:   ["GLOBAL",   "#0b5cff", "Remoto worldwide / região aberta"],
    exterior: ["EXTERIOR", "#a15b00", "Presencial no exterior ou remoto travado noutro país"],
  };
  const [txt, col, tip] = m[r] || m.global;
  return `<span title="${tip}" style="display:inline-block;font-size:10px;font-weight:700;`
    + `letter-spacing:.04em;color:#fff;background:${col};border-radius:4px;padding:1px 5px;margin-right:2px">${txt}</span>`;
};

async function load() {
  const status = $("#status");
  for (let attempt = 1; attempt <= 6; attempt++) {
    try {
      const r = await fetch(BACKEND + "/api/jobs?limit=40", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      jobs = d.items || [];
      const s = d.summary || {};
      const when = d.generated_at ? new Date(d.generated_at).toLocaleString("pt-BR") : "—";
      $("#sub").textContent =
        `${when} · ${s.collected ?? "?"} coletadas · ${d.total ?? jobs.length} recomendadas`;
      status.hidden = true;
      render();
      return;
    } catch (e) {
      status.textContent = attempt === 1
        ? "Acordando o servidor… pode levar até 1 minuto."
        : `Acordando o servidor… (tentativa ${attempt})`;
      await new Promise((res) => setTimeout(res, 12000));
    }
  }
  status.textContent = "Não consegui falar com o servidor. Recarregue a página em instantes.";
}

function render() {
  const list = $("#list");
  const slice = jobs.slice(shown, shown + (shown ? STEP : PAGE));
  shown += slice.length;
  for (const j of slice) list.appendChild(card(j));
  $("#more").hidden = shown >= jobs.length;
}

function card(j) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="top">
      <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <span class="badge">${esc(j.score)}</span>
    </div>
    <div class="meta">${regionTag(j.region)} ${esc(j.company || "empresa não informada")} · ${esc(j.location || "—")} · <i>${esc(j.source)}</i></div>
    ${j.salary ? `<div class="sal">Salário: ${esc(j.salary)}</div>` : ""}
    <ul class="reasons">${(j.reasons || []).map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    ${j.analysis_html ? `<details><summary>Saber mais</summary><div class="analysis">${j.analysis_html}</div></details>` : ""}
    <details class="chat">
      <summary>Perguntar sobre a vaga</summary>
      <div class="chat-log"></div>
      <div class="chat-row">
        <input placeholder="ex: aceita remoto do Brasil? essa empresa é boa?" maxlength="600">
        <button>Enviar</button>
      </div>
    </details>`;
  wireChat(el, j.uid);
  return el;
}

function wireChat(el, uid) {
  const log = el.querySelector(".chat-log");
  const input = el.querySelector(".chat-row input");
  const btn = el.querySelector(".chat-row button");
  const history = [];
  const add = (who, text) => { log.textContent += (who === "user" ? "\nVocê: " : "\nIA: ") + text + "\n"; };
  async function ask() {
    const q = input.value.trim();
    if (!q) return;
    input.value = ""; add("user", q); btn.disabled = true;
    try {
      const r = await fetch(BACKEND + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid, question: q, history }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) add("ia", "(" + (d.detail || d.error || ("erro " + r.status)) + ")");
      else { add("ia", d.answer); history.push({ role: "user", content: q }, { role: "assistant", content: d.answer }); }
    } catch (e) {
      add("ia", "(sem conexão com o servidor — ele pode estar acordando, tente de novo em 1 min)");
    }
    btn.disabled = false;
  }
  btn.addEventListener("click", ask);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
}

$("#more").addEventListener("click", render);
load();
</script>
</body>
</html>
